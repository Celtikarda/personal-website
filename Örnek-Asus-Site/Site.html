<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUS Tuf Gaming</title>
    <link rel="shortcut icon" href="/CSS/04.07.2026/Örnek Site/images.png">
    <meta name="description" content="Asus TUF Gaming oyuncu laptopları ve bilgisayar ürünleri mağazası.">
    <meta name="keywords" content="gaming laptop, bilgisayar, RTX laptop">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 300vh;
            border-width: 2px;
            border-style: solid;
            border-color: #ffb000;
            background-color: #0d0d0d;
            margin: 0px;
            border-radius: 1px;

        }


        header {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            background-color: #0d0d0d;
            box-shadow: 0 0 20px #ffb000;
            border-bottom: 2px solid #ffb000;


            position: fixed;
            /* Sayfayı kaydırsan da yukarıda sabit kalır */
            top: 0;
            /* En üste yapıştırır */
            left: 0;
            /* En sola yapıştırır */
            width: 100%;
            /* fixed olunca daralmasın diye tam genişlik verdik */
            box-sizing: border-box;
            /* padding (60px) yüzünden sağa taşma yapmasın diye ekledik */
            z-index: 1000;
            /* Diğer elemanların (örneğin resmin) her zaman üstünde dursun diye */
        }

        article {
            height: 90vh;
            width: 100%;
            background-image: url("kv_v2-p-3200.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;




            margin-top: 60px;
            /* Header'ın yüksekliği kadar yukarıdan boşluk bıraktık */

        }

        .logo {

            width: 100px;
            height: 45px;
            background-image: url("pngegg.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;

        }


        ul li {
            list-style-type: none;


        }

        nav {

            display: flex;
            gap: 35px;


        }


        nav a {
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-decoration: none;
            color: antiquewhite;
        }

        nav a:hover {

            color: #ffb000;

        }

        #menu {
            text-align: center;
            text-decoration: whitesmoke;



        }

        h1 {
            font-family: "Orbitron", sans-serif;
            padding-top: 1000px;
            margin: 0px;
            font-weight: 900;
            color: white;

        }

        h2 {

            font-family: "Orbitron", sans-serif;

            margin: 0px;
            font-weight: 900;
            color: #ffb000;



        }

        .altlogo {
            display: flex;
            justify-content: center;
            width: 100%;
            height: 125px;
            gap: 100px;

            margin-top: 100px;



        }

        .overviewp {
            display: flex;
            color: #ffb000;
            font-style: italic;
            justify-content: center;
            margin-top: 200px;
            display: flex;
            text-align: center;
            font-family: "Rajdhani", sans-serif;
            font-weight: bolder;
            font-size: xx-large;
        }

        .overviewp2 {
            display: flex;

            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #b8b8b8;
            font-size: larger;

        }

        .overviewp3 {
            display: flex;
            justify-content: center;
            font-family: 'Exo 2', sans-serif;
            font-weight: bolder;
            font-size: xx-large;
            color: #d6d6d6;

        }

        .learn {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .learn button {

            width: 180px;
            height: 50px;

            background: #ffb000;
            color: #0d0d0d;

            border: none;
            border-radius: 5px;

            font-family: 'Exo 2', sans-serif;
            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
            transition: .3;
        }

        .learn button:hover {

            background: #ffd04d;

            box-shadow: 0 0 15px #ffb000;

        }

        .overview-picture {
            margin-left: 150px;
        }
        #overview{
            margin-top: 800px;
            margin-left: 125px;

</head>

<body>
    <header>

    </div>
